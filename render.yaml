services:
  - type: web
    name: darfin-book
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: DARFIN BOOK
      - key: APP_LOCALE
        value: id-ID
      - key: DEFAULT_BOOK_LANGUAGE
        value: id
      - key: STRICT_INDONESIAN_CATALOG
        value: "true"
      - key: DATABASE_PATH
        value: ./data/darfin_book.db
      - key: OPEN_LIBRARY_USER_AGENT
        value: DarfinBook/1.0 (contact: support@darfinbook.id)
      - key: OPEN_LIBRARY_CONTACT_EMAIL
        value: support@darfinbook.id
      - key: WIKISOURCE_API_BASE_URL
        value: https://id.wikisource.org/w/api.php
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Optional: set when telegram bot token is ready
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
